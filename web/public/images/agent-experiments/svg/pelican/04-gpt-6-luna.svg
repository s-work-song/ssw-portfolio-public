<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedaler</title>
  <desc id="desc">A cheerful pelican cycles along a sunny path. The wheels and pedals turn as the pelican bobs gently.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bfe9e1"/><stop offset="1" stop-color="#f1f4cf"/>
    </linearGradient>
    <linearGradient id="feather" x2="0.8" y2="1">
      <stop stop-color="#fffdf0"/><stop offset="1" stop-color="#e7e5d2"/>
    </linearGradient>
    <linearGradient id="bill" x2="0" y2="1">
      <stop stop-color="#ffb33d"/><stop offset="1" stop-color="#ee7043"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="wheel">
      <circle r="88" fill="#f7fbec" stroke="#203e46" stroke-width="9"/>
      <circle r="78" fill="none" stroke="#a2b8ad" stroke-width="2"/>
      <g stroke="#78958f" stroke-width="2" opacity=".75">
        <path d="M0-78V78M-78 0H78M-55-55L55 55M55-55L-55 55"/>
        <path d="M-30-72L30 72M30-72L-30 72M-72-30L72 30M72-30L-72 30"/>
      </g>
      <circle r="9" fill="#ef8b4e" stroke="#203e46" stroke-width="4"/>
    </g>
    <style>
      .ink { stroke:#203e46; stroke-linecap:round; stroke-linejoin:round; }
      .bike { fill:none; stroke:#e8794d; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
      .leg { fill:none; stroke:#ec9846; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
      .label { font: 700 18px system-ui, sans-serif; letter-spacing:3px; fill:#456c69; }
      @media (prefers-reduced-motion: reduce) {
        .motion { animation-play-state: paused !important; }
      }
    </style>
  </defs>

  <!-- warm little world -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="790" cy="112" r="55" fill="#ffd879" opacity=".95"/>
  <circle cx="790" cy="112" r="73" fill="none" stroke="#ffe8a8" stroke-width="2" opacity=".75"/>
  <g fill="#fffdf0" opacity=".8">
    <path d="M115 143c3-17 18-27 35-23 8-20 41-18 46 5 18-2 27 8 27 19 0 10-9 17-23 17h-62c-15 0-25-7-23-18z"/>
    <path d="M615 194c2-12 13-19 25-16 6-14 29-13 33 4 13-2 20 5 20 13s-7 13-17 13h-44c-11 0-18-5-17-14z" opacity=".65"/>
  </g>
  <path d="M0 407c142-28 255-21 382-1 167 26 337 27 578-11v245H0z" fill="#bdd6a0"/>
  <path d="M0 458c197-24 334-6 485 7 170 14 307 3 475-21v196H0z" fill="#a9c68e" opacity=".7"/>
  <path d="M0 524c215-25 404-11 574 5 145 14 268 5 386-13v124H0z" fill="#304e4e"/>
  <path d="M0 534c210-25 423-7 582 7 137 12 255 3 378-15" fill="none" stroke="#f5e5a9" stroke-width="4" stroke-dasharray="24 24" opacity=".85"/>
  <ellipse cx="466" cy="520" rx="251" ry="25" fill="#183d42" opacity=".18" filter="url(#softShadow)"/>
  <text x="62" y="78" class="label">SUNNY SIDE CYCLING CLUB</text>

  <!-- spinning bicycle wheels -->
  <g class="motion">
    <animateTransform attributeName="transform" type="rotate" from="0 320 430" to="360 320 430" dur="1.8s" repeatCount="indefinite"/>
    <use xlink:href="#wheel" x="320" y="430"/>
  </g>
  <g class="motion">
    <animateTransform attributeName="transform" type="rotate" from="0 610 430" to="360 610 430" dur="1.8s" repeatCount="indefinite"/>
    <use xlink:href="#wheel" x="610" y="430"/>
  </g>

  <!-- bicycle frame -->
  <g class="bike">
    <path d="M410 300L320 430L430 430L410 300M410 300L535 290L430 430M535 290L610 430M320 430L430 430"/>
    <path d="M526 283L545 283L552 316L536 318Z" fill="#ef9b61" stroke="#203e46" stroke-width="5"/>
    <path d="M539 286L551 249M511 249L567 249M511 249q-12 0-12 12v5M567 249q12 0 12 12v5" stroke="#203e46" stroke-width="7"/>
    <path d="M395 289Q410 282 434 289" stroke="#203e46" stroke-width="10"/>
    <circle cx="430" cy="430" r="12" fill="#f5bf58" stroke="#203e46" stroke-width="5"/>
  </g>

  <!-- crank and pedals -->
  <g class="motion">
    <animateTransform attributeName="transform" type="rotate" from="0 430 430" to="360 430 430" dur="1.8s" repeatCount="indefinite"/>
    <path d="M394 430H466" stroke="#203e46" stroke-width="8" stroke-linecap="round"/>
    <circle cx="394" cy="430" r="7" fill="#f5bf58" stroke="#203e46" stroke-width="3"/>
    <circle cx="466" cy="430" r="7" fill="#f5bf58" stroke="#203e46" stroke-width="3"/>
  </g>

  <!-- cycling legs, timed to the crank -->
  <path class="leg" d="M390 268L427 345L466 430">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear"
      values="M390 268L427 345L466 430;M390 268L405 337L430 394;M390 268L385 350L394 430;M390 268L418 370L430 466;M390 268L427 345L466 430"/>
  </path>
  <path class="leg" d="M410 270L395 355L394 430">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="linear"
      values="M410 270L395 355L394 430;M410 270L425 374L430 466;M410 270L440 348L466 430;M410 270L424 335L430 394;M410 270L395 355L394 430"/>
  </path>
  <!-- little shoes follow the pedals -->
  <g class="motion">
    <animateTransform attributeName="transform" type="rotate" from="0 430 430" to="360 430 430" dur="1.8s" repeatCount="indefinite"/>
    <path d="M449 422q17-7 27 1l9 8q2 5-4 6h-31q-7 0-7-5zM377 422q17-7 27 1l9 8q2 5-4 6h-31q-7 0-7-5z" fill="#ef9847" stroke="#203e46" stroke-width="4"/>
  </g>

  <!-- pelican: torso gently bobs with the ride -->
  <g class="motion">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" keyTimes="0;.25;.5;.75;1" dur="1.8s" repeatCount="indefinite"/>
    <!-- long neck -->
    <path d="M435 231Q455 193 468 172Q479 156 496 165Q508 172 498 186Q479 208 477 236" fill="url(#feather)" class="ink" stroke-width="5"/>
    <!-- body -->
    <path d="M341 237Q348 195 389 187Q431 177 464 203Q486 222 473 252Q458 281 404 279Q361 278 341 258Q333 250 341 237Z" fill="url(#feather)" class="ink" stroke-width="5"/>
    <!-- wing -->
    <path d="M356 231Q390 199 430 216Q450 226 449 246Q421 260 385 254Q364 251 356 231Z" fill="#7bb5ad" class="ink" stroke-width="4"/>
    <path d="M375 238Q400 222 428 231M383 247Q407 235 432 239" fill="none" stroke="#d4eee0" stroke-width="4" stroke-linecap="round"/>
    <path d="M350 240Q337 234 333 225" fill="none" stroke="#203e46" stroke-width="4" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="489" cy="157" r="29" fill="url(#feather)" class="ink" stroke-width="5"/>
    <circle cx="499" cy="151" r="4.5" fill="#203e46"/>
    <circle cx="500.5" cy="149.5" r="1.5" fill="#fffdf0"/>
    <!-- bill and the unmistakable pouch -->
    <path d="M510 153Q547 147 586 158Q563 172 516 170Z" fill="url(#bill)" class="ink" stroke-width="4"/>
    <path d="M516 169Q540 178 572 169Q564 205 539 211Q519 204 516 169Z" fill="#f08a62" class="ink" stroke-width="4"/>
    <path d="M520 174Q542 184 568 174" fill="none" stroke="#d86350" stroke-width="3"/>
    <path d="M483 126q8-7 17-3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <!-- tail feathers -->
    <path d="M343 238l-26-8 20 17-24 2 30 11" fill="#fffdf0" class="ink" stroke-width="4"/>
  </g>

  <!-- small moving accents -->
  <g fill="#f8e7aa" opacity=".9">
    <circle cx="690" cy="330" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="257" cy="300" r="3"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <path d="M743 388q10-8 20 0-10-3-20 0z"><animateTransform attributeName="transform" type="translate" values="0 0;8 -2;0 0" dur="2.2s" repeatCount="indefinite"/></path>
  </g>
</svg>
