  <path d="M369 503C399 516 449 520 497 520" stroke="#ffffff" stroke-width="0.85" stroke-opacity="0.93" stroke-linecap="round"/>
  <path d="M389 459C421 450 458 447 492 447" stroke="#fffffb" stroke-width="1.5" stroke-opacity="0.46" stroke-linecap="round"/>
