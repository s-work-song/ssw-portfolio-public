      <stop offset="0.012" stop-color="#fbffff" stop-opacity="0.9"/>
      <stop offset="0.028" stop-color="#faffff" stop-opacity="0.53"/>
      <stop offset="0.053" stop-color="#849a9c" stop-opacity="0.19"/>
