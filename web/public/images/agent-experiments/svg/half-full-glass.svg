<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1000 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">물이 반쯤 담긴 투명한 유리잔</title>
  <desc id="description">부드러운 자연광 아래 밝은 회색 탁자에 놓인 투명한 물컵. 물은 잔의 절반 높이까지 차 있고, 유리 가장자리와 수면에는 은은한 반사광이 비친다. 모든 요소를 SVG 도형과 그라디언트로 그렸다.</desc>

  <defs>
