    <filter id="castBlur" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="contactBlur" x="-25%" y="-100%" width="150%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="bloom" x="-25%" y="-100%" width="150%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soften" x="-50%" y="-25%" width="200%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.25"/></filter>
    <filter id="hairline" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0.35"/></filter>
    <clipPath id="bodyClip"><path d="M322 232C326 382 342 615 355 731C359 769 419 791 500 791C581 791 641 769 645 731C658 615 674 382 678 232C678 203 598 180 500 180C402 180 322 203 322 232Z"/></clipPath>
    <clipPath id="waterClip"><path d="M343 483C347 563 357 676 364 722C370 751 427 770 500 770C573 770 630 751 636 722C643 676 653 563 657 483C657 460 587 441 500 441C413 441 343 460 343 483Z"/></clipPath>
