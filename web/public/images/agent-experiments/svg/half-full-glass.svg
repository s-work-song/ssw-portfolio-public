      <stop stop-color="#fafaf7"/>
      <stop offset="0.5" stop-color="#eeeeea"/>
      <stop offset="1" stop-color="#d9ddd9"/>
    </radialGradient>
    <radialGradient id="daylight" cx="0.12" cy="0.15" r="0.88">
