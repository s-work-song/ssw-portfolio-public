  <path d="M333 234C333 209 409 190 500 190C591 190 667 209 667 234" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M334 246C339 359 352 575 365 703" stroke="#8da29b" stroke-opacity="0.13" stroke-width="1.3"/>
  <path d="M666 246C661 359 648 575 635 703" stroke="#76968d" stroke-opacity="0.15" stroke-width="1.3"/>

  <!-- 절반 높이의 맑은 물. -->
