  <ellipse cx="500" cy="231.5" rx="174.5" ry="48.9" stroke="#fbfffa" stroke-opacity="0.68" stroke-width="1.2"/>
  <path d="M324 234C327 263 404 285 500 285C596 285 673 263 676 234" stroke="#667e74" stroke-width="1.5" stroke-opacity="0.37"/>
  <path d="M325 232C325 260 403 282 500 282C597 282 675 260 675 232" stroke="url(#rimFront)" stroke-width="2.8"/>
  <path d="M335 245C351 266 419 280 478 280" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.96"/>
  <path d="M345 207C380 189 440 181 496 182" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M567 186C607 190 643 199 660 211" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.87"/>
</svg>
