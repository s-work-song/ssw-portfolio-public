    <path d="M351 512C370 546 367 675 387 729C399 749 445 757 470 760" stroke="#fafff7" stroke-width="8" stroke-opacity="0.25" filter="url(#soften)"/>
    <path d="M638 508C643 557 627 685 620 720C617 734 611 742 601 749" stroke="#f7fff9" stroke-width="5" stroke-opacity="0.42" filter="url(#soften)"/>
    <path d="M372 732C410 754 581 765 627 731C597 771 410 779 372 732Z" fill="#6c8c7f" fill-opacity="0.14"/>
    <path d="M388 738C433 753 556 759 607 742" stroke="#faffed" stroke-width="5" stroke-opacity="0.46" filter="url(#bloom)"/>
  </g>

