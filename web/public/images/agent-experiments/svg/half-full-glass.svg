  <!-- 밝은 탁자와 부드러운 자연광. -->
  <rect width="1000" height="1000" fill="url(#background)"/>
  <rect width="1000" height="1000" fill="url(#daylight)"/>

  <!-- 유리잔이 만드는 그림자와 탁자 위의 집광 무늬. -->
  <ellipse cx="589" cy="806" rx="215" ry="48" transform="rotate(13 589 806)" fill="#63726a" opacity="0.14" filter="url(#castBlur)"/>
  <ellipse cx="503" cy="786" rx="148" ry="24" fill="#64776d" opacity="0.19" filter="url(#contactBlur)"/>
  <ellipse cx="508" cy="782" rx="122" ry="14" fill="#566c61" opacity="0.12" filter="url(#contactBlur)"/>
  <ellipse cx="534" cy="802" rx="122" ry="30" fill="url(#baseLight)"/>
  <path d="M380 793C418 822 568 838 654 805C669 799 681 793 689 785C648 819 487 821 419 802" stroke="#fffff5" stroke-width="7" stroke-linecap="round" opacity="0.64" filter="url(#bloom)"/>
  <path d="M425 806C480 824 574 826 630 811" stroke="#fbfff6" stroke-width="2" opacity="0.72" filter="url(#hairline)"/>

